name: Bug report
description: Report a reproducible problem with the package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Laravel Assignment. Remove personal information and any business data from model names, candidate lists, and logs before sharing them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what happened and what you expected instead.
      placeholder: I expected X, but Y happened.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce the bug
      description: Provide the smallest code sample or sequence of steps that reliably reproduces the problem. The candidates passed in, the selection policy, and the role are usually the clearest form.
      placeholder: "1. Candidates are...\n2. Selection policy is...\n3. Call offer() with...\n4. Observe..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area does this affect?
      options:
        - Assigning or offering
        - Accepting or declining an offer
        - Selection policy (round robin, least loaded, and so on)
        - Expiry and the queue
        - Reading status or history
        - Events
        - Other
    validations:
      required: true
  - type: dropdown
    id: concurrency
    attributes:
      label: Does this involve concurrent assignment?
      description: Two or more callers racing for the same slot. These are the reports we most want, and they usually need a real database rather than SQLite to reproduce.
      options:
        - "No, it reproduces with one caller"
        - "Yes, it only happens under concurrency"
        - "Not sure"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Which Laravel Assignment version are you using?
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Which PHP version are you using?
      placeholder: 8.3.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      description: Which Laravel version are you using?
      placeholder: 12.0.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Which database are you using?
      options:
        - SQLite
        - MySQL / MariaDB
        - PostgreSQL
        - Other
    validations:
      required: true
  - type: dropdown
    id: operating-systems
    attributes:
      label: Which operating systems does this happen with?
      description: You may select more than one.
      multiple: true
      options:
        - macOS
        - Windows
        - Linux
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add any other relevant context, such as the relevant config, the profile in use, or stack traces.
    validations:
      required: false
